apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synology-csi
resources:
  # https://github.com/zebernst/synology-csi-talos/tree/main/deploy/kubernetes/v1.20
  - controller.yml
  - csi-driver.yml
  - namespace.yml
  - node.yml

  # Encrypted secrets
  - secret-client-info.sops.yaml
  - secret-ghcr-login.sops.yaml

  # Storage classes
  - storage-class-retain.yaml
  - storage-class-default.yaml